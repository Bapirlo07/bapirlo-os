<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bapirlo Writer — "Kuro" app icon: ink squircle, paper page with ink lines,
       crimson pen nib cutting across it with manga speed lines and a sakura spark.
       Same construction as ../welcome-app/bapirlo-welcome.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1F25"/>
      <stop offset="1" stop-color="#0E0A0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#FF4655" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#E11D2E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4655"/>
      <stop offset="1" stop-color="#B3121F"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#F2E9EC" opacity="0.07"/>
    </pattern>
    <clipPath id="sq"><rect x="24" y="24" width="464" height="464" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="24" y="24" width="464" height="464" fill="url(#bg)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#dots)"/>
    <!-- speed lines streaking away from the nib tip -->
    <g stroke="#E11D2E" stroke-width="4" opacity="0.24" stroke-linecap="round">
      <line x1="226" y1="330" x2="40" y2="200"/><line x1="226" y1="330" x2="60" y2="470"/>
      <line x1="226" y1="330" x2="30" y2="330"/><line x1="226" y1="330" x2="150" y2="482"/>
      <line x1="226" y1="330" x2="100" y2="60"/>
    </g>
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>

    <!-- paper page, slightly tilted -->
    <g transform="rotate(-6 210 290)">
      <rect x="96" y="120" width="236" height="300" rx="18" fill="#F2E9EC"/>
      <path d="M282 120 h32 a18 18 0 0 1 18 18 v32 z" fill="#D9C9CF"/>
      <g stroke="#0E0A0D" stroke-linecap="round">
        <line x1="130" y1="178" x2="268" y2="178" stroke-width="12"/>
        <line x1="130" y1="218" x2="296" y2="218" stroke-width="9" opacity="0.75"/>
        <line x1="130" y1="252" x2="258" y2="252" stroke-width="9" opacity="0.75"/>
        <line x1="130" y1="286" x2="284" y2="286" stroke-width="9" opacity="0.75"/>
        <line x1="130" y1="320" x2="214" y2="320" stroke-width="9" opacity="0.75"/>
      </g>
      <!-- the crimson "fix" underline -->
      <path d="M130 352 q22 -12 44 0 t44 0 t44 0" fill="none" stroke="#E11D2E" stroke-width="8"
            stroke-linecap="round"/>
    </g>

    <!-- pen nib, coming in from the top right -->
    <g transform="rotate(38 330 230)">
      <path d="M306 70 h48 v150 l-24 74 l-24 -74 z" fill="url(#nib)"/>
      <path d="M306 70 h48 v150 l-24 74 l-24 -74 z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
            stroke-width="4" stroke-linejoin="round"/>
      <line x1="330" y1="200" x2="330" y2="286" stroke="#0E0A0D" stroke-width="5" stroke-linecap="round"/>
      <circle cx="330" cy="196" r="9" fill="#0E0A0D"/>
      <rect x="300" y="40" width="60" height="34" rx="8" fill="#2A1F25" stroke="#F2E9EC"
            stroke-opacity="0.35" stroke-width="3"/>
    </g>

    <!-- sakura spark -->
    <g transform="translate(418 404)" fill="#F08AA4">
      <path d="M0 -26 L6 -6 L26 0 L6 6 L0 26 L-6 6 L-26 0 L-6 -6 Z"/>
    </g>
    <circle cx="384" cy="446" r="6" fill="#F08AA4" opacity="0.8"/>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"
        stroke-width="3"/>
</svg>
