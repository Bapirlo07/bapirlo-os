<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bapirlo OS logo: ink-brush ring, bold manga "B", katana slash -->
  <defs>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#2f7cff"/>
      <stop offset="0.45" stop-color="#ff3d8b"/>
      <stop offset="1"    stop-color="#10c98f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="upper"><polygon points="0,0 512,0 512,150 0,410"/></clipPath>
    <clipPath id="lower"><polygon points="0,410 512,150 512,512 0,512"/></clipPath>
  </defs>

  <!-- brush ring (enso), open at top-right -->
  <path d="M372 96 A196 196 0 1 0 452 214" fill="none" stroke="#e3242b"
        stroke-width="30" stroke-linecap="round"/>
  <path d="M352 82 A208 208 0 0 0 120 92" fill="none" stroke="#e3242b"
        stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- the "B", split along the slash; upper half nudged up-left -->
  <g id="B">
    <path fill="#0b0b0d" stroke="#0b0b0d" stroke-width="10" stroke-linejoin="round"
      d="M168 132 H286 C346 132 378 162 378 206 C378 236 362 256 336 266
         C370 276 390 302 390 338 C390 388 352 420 290 420 H168 Z
         M228 182 V246 H280 C306 246 318 234 318 214 C318 194 306 182 280 182 Z
         M228 294 V370 H286 C316 370 330 356 330 332 C330 308 316 294 286 294 Z"/>
  </g>
  <g clip-path="url(#upper)" transform="translate(-6,-6)">
    <path fill="#e3242b" stroke="#0b0b0d" stroke-width="10" stroke-linejoin="round"
      d="M168 132 H286 C346 132 378 162 378 206 C378 236 362 256 336 266
         C370 276 390 302 390 338 C390 388 352 420 290 420 H168 Z
         M228 182 V246 H280 C306 246 318 234 318 214 C318 194 306 182 280 182 Z
         M228 294 V370 H286 C316 370 330 356 330 332 C330 308 316 294 286 294 Z"/>
  </g>
  <g clip-path="url(#lower)" transform="translate(6,6)">
    <path fill="#e3242b" stroke="#0b0b0d" stroke-width="10" stroke-linejoin="round"
      d="M168 132 H286 C346 132 378 162 378 206 C378 236 362 256 336 266
         C370 276 390 302 390 338 C390 388 352 420 290 420 H168 Z
         M228 182 V246 H280 C306 246 318 234 318 214 C318 194 306 182 280 182 Z
         M228 294 V370 H286 C316 370 330 356 330 332 C330 308 316 294 286 294 Z"/>
  </g>

  <!-- katana slash -->
  <g filter="url(#glow)">
    <polygon points="34,424 486,140 492,150 44,436" fill="url(#slash)"/>
    <polygon points="70,404 470,152 474,157 76,410" fill="#ffffff"/>
  </g>
</svg>
