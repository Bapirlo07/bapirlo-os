# Kuro OS — Hyprland session (Kuro) — LEGACY hyprlang copy. Hyprland 0.57+ reads hyprland.lua instead; edit that.
# Colours live in bapirlo-colors.conf, re-written by tools/hypr-theme.py whenever Theme Studio
# re-themes for a new wallpaper, so edit the template there, not the generated file.

source = ~/.config/hypr/bapirlo-colors.conf

# ---------------------------------------------------------------- monitors
# Laptop panel at native res, scale 1 (same as GNOME). Anything plugged in: preferred, to the right.
monitor = eDP-1, highrr, 0x0, 1
monitor = , preferred, auto, 1

# ---------------------------------------------------------------- environment
# The Intel iGPU drives the panel; AQ_DRM_DEVICES is set by bapirlo-hyprland-session so the RTX stays asleep.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bapirlo-Cursors
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# ---------------------------------------------------------------- autostart
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swayosd-server
exec-once = ~/bapirlo-os/bin/bapirlo-hypr-wallpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator

# ---------------------------------------------------------------- look
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $crimson $ember 45deg
    col.inactive_border = $line
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 5 5
        color = $shadow
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = snap, 0.22, 1, 0.36, 1
    bezier = slash, 0.7, 0, 0.2, 1
    animation = windows, 1, 5, snap, popin 82%
    animation = windowsOut, 1, 4, slash, popin 82%
    animation = border, 1, 8, default
    animation = borderangle, 1, 60, default, loop
    animation = fade, 1, 5, snap
    animation = workspaces, 1, 5, slash, slidefade 18%
    animation = layers, 1, 4, snap, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $ink
    vfr = true
    focus_on_activate = true
}

input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

cursor {
    no_hardware_cursors = false
}

# ---------------------------------------------------------------- keys
# Same muscle memory as the GNOME side where it makes sense.
$mod = SUPER
$term = alacritty
$files = nautilus --new-window
$menu = fuzzel

bind = $mod, Return, exec, $term
bind = $mod, Space, exec, $menu
bind = $mod, A, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = ALT, F4, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, T, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, ~/bapirlo-os/bin/bapirlo-hypr-power
bind = $mod, V, exec, cliphist list | fuzzel --dmenu --prompt "clipboard › " | cliphist decode | wl-copy

# Kuro apps (same chords as GNOME)
bind = $mod ALT, P, exec, ~/bapirlo-os/bin/bapirlo-wallpaper
bind = $mod ALT, N, exec, ~/bapirlo-os/bin/bapirlo-wallpaper next
bind = $mod ALT, W, exec, ~/bapirlo-os/bin/bapirlo-wallpaper live toggle
bind = $mod ALT, T, exec, ~/bapirlo-os/bin/bapirlo-wallpapers --page theme
bind = $mod ALT, R, exec, hyprctl reload

# screenshots
bind = , Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = SHIFT, Print, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = $mod SHIFT, S, exec, hyprshot -m region --clipboard-only

# focus / move
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod SHIFT, S, movetoworkspace, special:scratch

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media / hardware keys (swayosd draws the on-screen bubble)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ---------------------------------------------------------------- windows
windowrule = float on, match:class ^(pavucontrol|blueman-manager|nm-connection-editor|os\.bapirlo\..*)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = suppress_event maximize, match:class .*

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace launcher
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace launcher
