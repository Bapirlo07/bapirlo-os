### Bapirlo OS — MangoHud "Kuro" (ink panel, crimson accents, same 10px radius as the desktop)
### Toggle in game: Right Shift + F12      Off for one game: launch it without `mangohud`
### frametime_color / cpu_color follow the wallpaper (bapirlo-autotheme); the rest is fixed.
toggle_hud=Shift_R+F12
# starts visible; set `no_display` to start hidden
legacy_layout=false
position=top-left
offset_x=14
offset_y=14
round_corners=10
background_color=0E0A0D
background_alpha=0.62
font_file=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Bold.ttf
font_size=19
text_color=F2E9EC
text_outline
text_outline_color=0E0A0D
text_outline_thickness=1.2
table_columns=3
hud_compact

# FPS (red under 30, amber under 60, white above) + frame time graph
fps
fps_color_change
fps_value=30,60
fps_color=E11D2E,F2B45A,F2E9EC
frame_timing=1
frametime_color=F08AA4
histogram

# GPU (the RTX 4060) and CPU: load, temperature; load turns ember → crimson when busy
gpu_stats
gpu_temp
gpu_text=GPU
gpu_color=E11D2E
gpu_load_change
gpu_load_value=60,90
gpu_load_color=F2E9EC,FF4655,E11D2E
cpu_stats
cpu_temp
cpu_text=CPU
cpu_color=F08AA4
cpu_load_change
cpu_load_value=60,90
cpu_load_color=F2E9EC,FF4655,E11D2E

# no logging, no extra polling
fps_sampling_period=500
