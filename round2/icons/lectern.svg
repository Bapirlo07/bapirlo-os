<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lectern — Bapirlo OS "Kuro" app icon: ink squircle, paper book, crimson stand + ribbon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1F25"/>
      <stop offset="1" stop-color="#0E0A0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.42">
      <stop offset="0" stop-color="#FF4655" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E11D2E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4655"/>
      <stop offset="1" stop-color="#B3121F"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4D6DB"/>
      <stop offset="1" stop-color="#F2E9EC"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2E9EC"/>
      <stop offset="1" stop-color="#E4D6DB"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#F2E9EC" opacity="0.07"/>
    </pattern>
    <clipPath id="sq"><rect x="24" y="24" width="464" height="464" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="24" y="24" width="464" height="464" fill="url(#bg)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#dots)"/>
    <!-- manga speed lines -->
    <g stroke="#E11D2E" stroke-width="3" opacity="0.18" stroke-linecap="round">
      <line x1="256" y1="170" x2="60" y2="60"/><line x1="256" y1="170" x2="452" y2="60"/>
      <line x1="256" y1="170" x2="40" y2="170"/><line x1="256" y1="170" x2="472" y2="170"/>
      <line x1="256" y1="170" x2="150" y2="34"/><line x1="256" y1="170" x2="362" y2="34"/>
    </g>
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>
  </g>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="#E11D2E" stroke-opacity="0.45" stroke-width="3"/>

  <!-- stand: desk, column, foot -->
  <path d="M128 268 L384 268 L362 300 L150 300 Z" fill="url(#stand)"/>
  <rect x="236" y="298" width="40" height="104" rx="6" fill="url(#stand)"/>
  <rect x="164" y="398" width="184" height="30" rx="15" fill="url(#stand)"/>
  <rect x="164" y="398" width="184" height="8" rx="4" fill="#FF8A94" opacity="0.5"/>

  <!-- open book -->
  <path d="M256 138 C214 120 168 118 124 128 L124 262 C168 252 214 254 256 272 Z" fill="url(#pageL)"/>
  <path d="M256 138 C298 120 344 118 388 128 L388 262 C344 252 298 254 256 272 Z" fill="url(#pageR)"/>
  <path d="M256 138 L256 272" stroke="#0E0A0D" stroke-opacity="0.35" stroke-width="3"/>
  <!-- ink text lines -->
  <g stroke="#523B44" stroke-width="7" stroke-linecap="round">
    <path d="M150 164 C180 158 208 160 232 168"/><path d="M150 190 C180 184 208 186 232 194"/>
    <path d="M150 216 C180 210 208 212 232 220"/>
    <path d="M280 168 C304 160 332 158 362 164"/><path d="M280 194 C304 186 332 184 362 190"/>
  </g>
  <!-- crimson bookmark ribbon -->
  <path d="M318 132 L344 128 L344 232 L331 220 L318 236 Z" fill="#E11D2E"/>
  <path d="M318 132 L344 128 L344 140 L318 144 Z" fill="#7A0F1A"/>
</svg>
