# Bapirlo OS — bapirlo-perfd settings (sudo systemctl restart bapirlo-perfd after editing)
# Battery stops charging at this % (MSI EC; 50-100). 80 = longer battery life.
CHARGE_LIMIT=80
# Profile when the charger is plugged in / on battery (performance | balanced | power-saver)
AC_PROFILE=performance
BATTERY_PROFILE=power-saver
# What each profile sets in the MSI EC: "<shift mode> <fan mode>"
#   shift: turbo | comfort | eco      fan: auto | silent | advanced
MAP_performance=turbo auto
MAP_balanced=comfort auto
MAP_power-saver=eco silent
