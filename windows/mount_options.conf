# Bapirlo OS — Windows partition (its UUID is filled in by 700-windows-link.sh), mounted on demand by udisks / GNOME Files.
# Kernel ntfs3 driver, READ-ONLY unless explicitly asked for `rw` (use `bapirlo-windows rw`,
# which first checks that Windows is not hibernated / Fast Startup is off).
# windows_names: never create file names Windows can't open.  Undo: delete this file.
[/dev/disk/by-uuid/@WIN_UUID@]
ntfs_drivers=ntfs3
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,ro,windows_names,iocharset=utf8
ntfs:ntfs3_allow=uid=$UID,gid=$GID,umask,dmask,fmask,iocharset,windows_names,hide_dot_files,nohide_dot_files,prealloc,noprealloc
