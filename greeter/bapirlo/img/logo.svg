<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kuro OS logo: ink-brush ring, bold manga "K", katana slash -->
  <defs>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#7A0F1A"/>
      <stop offset="0.45" stop-color="#F08AA4"/>
      <stop offset="1"    stop-color="#F2E9EC"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="upper"><polygon points="0,0 512,0 512,150 0,410"/></clipPath>
    <clipPath id="lower"><polygon points="0,410 512,150 512,512 0,512"/></clipPath>
  </defs>

  <!-- brush ring (enso), open at top-right -->
  <path d="M372 96 A196 196 0 1 0 452 214" fill="none" stroke="#E11D2E"
        stroke-width="30" stroke-linecap="round"/>
  <path d="M352 82 A208 208 0 0 0 120 92" fill="none" stroke="#E11D2E"
        stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- the "K", split along the slash; upper half nudged up-left -->
  <g id="K">
    <path fill="#0E0A0D" stroke="#0E0A0D" stroke-width="10" stroke-linejoin="round"
      d="M168 132 H228 V250 L320 132 H396 L284 268 L400 420 H324 L244 312 L228 330 V420 H168 Z"/>
  </g>
  <g clip-path="url(#upper)" transform="translate(-6,-6)">
    <path fill="#E11D2E" stroke="#0E0A0D" stroke-width="10" stroke-linejoin="round"
      d="M168 132 H228 V250 L320 132 H396 L284 268 L400 420 H324 L244 312 L228 330 V420 H168 Z"/>
  </g>
  <g clip-path="url(#lower)" transform="translate(6,6)">
    <path fill="#E11D2E" stroke="#0E0A0D" stroke-width="10" stroke-linejoin="round"
      d="M168 132 H228 V250 L320 132 H396 L284 268 L400 420 H324 L244 312 L228 330 V420 H168 Z"/>
  </g>

  <!-- katana slash -->
  <g filter="url(#glow)">
    <polygon points="34,424 486,140 492,150 44,436" fill="url(#slash)"/>
    <polygon points="70,404 470,152 474,157 76,410" fill="#ffffff"/>
  </g>
</svg>
