<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kuro OS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="booting">
  <!-- Kuro OS login — web-greeter theme "Kuro". Shares its art and layout with the
       Plymouth splash (logo left third) so boot → login → desktop reads as one shot. -->
  <div id="stage">
    <div id="parallax"><div id="bg"></div></div>
    <div id="shade"></div>
    <div id="embers" aria-hidden="true"></div>
  </div>

  <main id="ui">
    <header id="brand">
      <img id="logo" src="img/logo.svg" alt="">
      <div class="wordmark">KURO<span>OS</span></div>
    </header>

    <section id="time">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </section>

    <section id="card">
      <div id="avatar-wrap">
        <div class="ring"></div>
        <img id="avatar" src="img/avatar.png" alt="">
      </div>
      <div id="who">
        <div id="lock-chip">LOCKED</div>
        <div id="name"></div>
      </div>
      <form id="login" autocomplete="off">
        <div id="field">
          <input id="password" type="password" placeholder="Password" spellcheck="false" autofocus>
          <button id="go" type="submit" aria-label="Log in">
            <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          </button>
          <span class="sweep"></span>
        </div>
      </form>
      <div id="message" role="status"></div>
    </section>
  </main>

  <footer id="bar">
    <div id="session" class="chip" tabindex="0">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8"/></svg>
      <span id="session-name">GNOME</span>
      <ul id="session-list"></ul>
    </div>
    <div id="power">
      <button class="pw" data-act="suspend" title="Suspend"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span>Sleep</span></button>
      <button class="pw" data-act="restart" title="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg><span>Restart</span></button>
      <button class="pw" data-act="shutdown" title="Shut down"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span>Shut down</span></button>
    </div>
  </footer>

  <div id="curtain"></div>

  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Outside web-greeter (browser preview / tests) there is no Qt bridge: load the mock.
    if (typeof window.qt === "undefined") {
      const s = document.createElement("script");
      s.src = "js/mock.js";
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
