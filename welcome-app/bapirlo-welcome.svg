<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kuro Welcome — "Kuro" app icon: ink squircle, crimson rising sun over ink horizon,
       manga speed lines, sakura spark. Same construction as round2/icons/lectern.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1F25"/>
      <stop offset="1" stop-color="#0E0A0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#FF4655" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#E11D2E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4655"/>
      <stop offset="1" stop-color="#B3121F"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#F2E9EC" opacity="0.07"/>
    </pattern>
    <clipPath id="sq"><rect x="24" y="24" width="464" height="464" rx="104"/></clipPath>
    <clipPath id="above"><rect x="24" y="24" width="464" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="24" y="24" width="464" height="464" fill="url(#bg)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#dots)"/>
    <!-- speed lines radiating from the sun -->
    <g stroke="#E11D2E" stroke-width="4" opacity="0.22" stroke-linecap="round">
      <line x1="256" y1="324" x2="40" y2="140"/><line x1="256" y1="324" x2="472" y2="140"/>
      <line x1="256" y1="324" x2="120" y2="40"/><line x1="256" y1="324" x2="392" y2="40"/>
      <line x1="256" y1="324" x2="256" y2="30"/><line x1="256" y1="324" x2="30" y2="250"/>
      <line x1="256" y1="324" x2="482" y2="250"/>
    </g>
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>
    <!-- sun, cut by the horizon -->
    <g clip-path="url(#above)">
      <circle cx="256" cy="324" r="118" fill="url(#sun)"/>
      <circle cx="256" cy="324" r="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
    </g>
    <!-- ink horizon with paper stripes (manga sea) -->
    <rect x="24" y="324" width="464" height="164" fill="#0E0A0D"/>
    <g stroke="#F2E9EC" stroke-linecap="round">
      <line x1="138" y1="350" x2="374" y2="350" stroke-width="10" opacity="0.9"/>
      <line x1="178" y1="384" x2="334" y2="384" stroke-width="8" opacity="0.55"/>
      <line x1="218" y1="414" x2="294" y2="414" stroke-width="6" opacity="0.3"/>
    </g>
    <line x1="24" y1="324" x2="488" y2="324" stroke="#E11D2E" stroke-width="5"/>
    <!-- sakura spark -->
    <g transform="translate(372 132)" fill="#F08AA4">
      <path d="M0 -34 L8 -8 L34 0 L8 8 L0 34 L-8 8 L-34 0 L-8 -8 Z"/>
      <circle r="6" fill="#FFFFFF"/>
    </g>
  </g>
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="#E11D2E" stroke-opacity="0.35" stroke-width="4"/>
</svg>
